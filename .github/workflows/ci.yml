name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q

  sleeper-live-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pull real league data from the Sleeper API
        run: python -m src.ingest.sleeper
      - name: Verify each output file was written and is non-empty JSON
        run: |
          for f in league.json rosters.json users.json teams.json players.json; do
            python -c "import json,sys; json.load(open('data/raw/sleeper/$f')) and sys.exit(0)"
          done
      - name: Chunk and embed the real pull into ChromaDB
        run: python -m src.rag.embed
      - name: Verify retrieval returns a real team roster chunk
        run: |
          python -c "
          from src.rag.retrieve import query
          results = query('team roster', n_results=1)
          assert results, 'expected at least one retrieved chunk'
          print(results[0])
          "
      - name: Generate eval questions from the real pull and run the retrieval-accuracy harness
        run: |
          python -m evals.build_eval_questions
          python -m evals.run_eval

  nflverse-live-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pull real nflverse weekly stats and confirm the file is non-empty
        run: |
          python -m src.ingest.nflverse --season 2024
          python -c "
          import polars as pl
          df = pl.read_parquet('data/raw/nflverse/weekly_2024.parquet')
          assert len(df) > 0, 'expected at least one row of weekly stats'
          print(f'{len(df)} rows')
          "
